<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BAL WALA - आपके बाल हैं आपका गहना</title>
    <meta name="description" content="BAL WALA - Hair selling and collection platform connecting customers with hair collectors. आपके बाल हैं आपका गहना, आपके बाल हैं आपका सोना।" />
    <meta property="og:title" content="BAL WALA - आपके बाल हैं आपका गहना" />
    <meta property="og:description" content="BAL WALA - Hair selling and collection platform connecting customers with hair collectors. आपके बाल हैं आपका गहना, आपके बाल हैं आपका सोना।" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" id="dynamic-theme-color" content="#E83E72" />
    <script>
      (function(){
        try {
          const h = (window.location.hostname || '').toLowerCase();
          const p = (window.location.pathname || '').toLowerCase();
          const isCollector = h.includes('collector') || p.startsWith('/collector');
          const isAdmin = h.includes('admin') || p.startsWith('/admin');
          const c = isCollector ? '#064e3b' : isAdmin ? '#111827' : '#E91E63';
          const metaTag = document.getElementById('dynamic-theme-color');
          if (metaTag) {
            metaTag.setAttribute('content', c);
          }
          // Also set apple status bar style dynamically
          const appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta && (isCollector || isAdmin)) {
            appleMeta.setAttribute('content', 'black-translucent');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BAL WALA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
